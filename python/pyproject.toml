[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "hessboost"
dynamic = ["version"]
description = "Fast, deterministic gradient boosting in Rust: conformal intervals, explainable boosting machines, distributional boosting, and tree-based diffusion"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Brenden Matthews", email = "brenden@brndn.io" }]
keywords = ["xgboost", "gradient-boosting", "gbdt", "machine-learning", "decision-trees", "rust"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 3 - Stable",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=2"]

[project.optional-dependencies]
# The CUDA runtime: the extension built with CUDA, which the package then
# loads in place of its own (`hessboost/_hessboost.py`). Linux only, and
# always this release (release.py bumps the pin with the version).
cuda = ["hessboost-runtime-cuda==0.3.0; sys_platform == 'linux'"]
pandas = ["pandas>=2.2"]
# 1.x and 2.x: uv.lock tests the latest, CI also the oldest and latest 1.x.
polars = ["polars>=1.0"]
scikit-learn = ["scikit-learn>=1.6"]

[project.urls]
Homepage = "https://github.com/brndnmtthws/hessboost"
Documentation = "https://github.com/brndnmtthws/hessboost/tree/main/python#readme"
Repository = "https://github.com/brndnmtthws/hessboost"
Issues = "https://github.com/brndnmtthws/hessboost/issues"
Changelog = "https://github.com/brndnmtthws/hessboost/releases"

[dependency-groups]
test = [
  "pytest>=9.1",
  # CI's `pyright --verifytypes` checks the installed wheel's public types.
  "pyright>=1.1.414",
  "pandas>=2.2",
  # abi3-only wheels: test-wheel.sh leaves it out on free-threaded Python.
  "polars>=1.0",
  "scikit-learn>=1.6",
  "scipy>=1.14",
]
# ruff and ty for all of the repository's Python (config: ../ruff.toml,
# ../ty.toml), plus what ty needs to resolve it.
lint = [
  { include-group = "test" },
  "ruff>=0.16.9",
  "ty>=0.0.84",
  "pandas-stubs>=2.2",
  "scipy-stubs>=1.14",
  # release.py's dependency.
  "tomlkit>=0.13",
]
dev = [{ include-group = "lint" }, "maturin>=1.15,<2"]

[tool.maturin]
# Every build (maturin CLI, `uv sync`/`uv run`, pip from the sdist) uses the
# committed Cargo.lock and fails instead of updating it.
locked = true
module-name = "hessboost._native"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
xfail_strict = true

[tool.uv]
# `uv sync` and `uv run` rebuild the extension when these change (by default
# uv only watches pyproject.toml). The root crate is a path dependency.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "src/**/*.rs" },
  { file = "../Cargo.toml" },
  { file = "../src/**/*.rs" },
  { file = "../src/**/*.ptx" },
  { env = "MATURIN_PEP517_ARGS" },
]

[tool.uv.sources]
# `uv sync --extra cuda` builds the CUDA runtime from `runtime-cuda/` (which
# needs the CUDA headers and libclang, see AGENTS.md) rather than fetching a
# published wheel. uv ignores this table when hessboost is a dependency.
hessboost-runtime-cuda = { path = "runtime-cuda" }

# uv builds the CUDA runtime concurrently with `hessboost` from the same
# crate, and maturin stages both extensions at one path in the Cargo target
# directory; a separate `runtime-cuda/target` keeps each wheel from packaging
# the other's extension.
[tool.uv.extra-build-variables]
hessboost-runtime-cuda = { CARGO_TARGET_DIR = "target" }
