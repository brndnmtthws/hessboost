[package]
name = "hessboost-python"
# Must equal the root crate's version: the wheel version comes from here.
version = "0.3.0"
authors = ["Brenden Matthews <brenden@brndn.io>"]
description = "Python bindings for hessboost"
edition = "2024"
license = "Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/brndnmtthws/hessboost"
rust-version = "1.93"
# What `maturin sdist` packages from this directory (build outputs such as
# `dist/`, `target/` and a `maturin develop` extension module stay out).
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/README.md",
  "/pyproject.toml",
  "/python/hessboost/**/*.py",
  "/python/hessboost/**/*.pyi",
  "/python/hessboost/py.typed",
  "/src/**/*.rs",
  "/tests/**/*.py",
]

[lib]
# `hessboost._native` in `hessboost`, `_hessboost_runtime_cuda._native` in
# `hessboost-runtime-cuda`; `python/hessboost/_hessboost.py` loads one.
name = "_native"
crate-type = ["cdylib"]
# An extension module has no Rust test harness; the Python tests exercise it.
test = false
doctest = false

[dependencies]
# `device="wgpu"` and `Booster.to_gpu(device="wgpu")` in every wheel: wgpu
# loads its Vulkan, Metal, and DirectX 12 drivers at run time, so a machine
# without them still imports the package and reports no adapter.
hessboost = { path = "..", features = ["wgpu"] }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py311"] }
# The extension's own pool, which a forked child rebuilds (`src/pool.rs`).
rayon = "1.12"
# Method configurations cross the boundary as their serde JSON.
serde = "1.0"
# Parameter mappings deserialize into `TrainingParams` through serde;
# `float_roundtrip` as in the root crate.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# Conformal calibrators borrow their model; `self_cell` keeps the model and
# the calibrator in one object without `unsafe` here.
self_cell = "1.2"

# `device="metal"` in the macOS wheels.
[target.'cfg(target_os = "macos")'.dependencies]
hessboost = { path = "..", features = ["metal"] }

[features]
# `device="cuda"` and `Booster.to_gpu(device="cuda")`, Linux only. Off in
# `hessboost`, so it builds without CUDA's build requirements and refuses
# CUDA; on in `hessboost-runtime-cuda` (`runtime-cuda/pyproject.toml`), which
# `hessboost[cuda]` installs.
cuda = ["hessboost/cuda"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Array lengths, row counts and indices convert between usize/u32/i64/f64
# at the Python boundary; their ranges are bounded by the data.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# PyO3 functions return `PyResult`; per-function error sections are
# boilerplate. `needless_pass_by_value`: PyO3 extracts arguments by value.
missing_errors_doc = "allow"
needless_pass_by_value = "allow"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"

# Isolated from the root crate, like `fuzz/`.
[workspace]
