name: Publish

on:
  push:
    tags: [v*]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
      - .github/scripts/install-lavapipe.sh
      - .github/scripts/test-wheel.sh
      - python/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validate:
    name: Validate crate and Python bindings
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Verify versions and lockfiles
        shell: bash
        run: |
          set -euo pipefail
          root_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hessboost") | .version')"
          python_version="$(cargo metadata --no-deps --format-version 1 --manifest-path python/Cargo.toml | jq -r '.packages[] | select(.name == "hessboost-python") | .version')"
          if [[ "${GITHUB_REF_NAME}" != "v${root_version}" || "${python_version}" != "${root_version}" ]]; then
            echo "tag ${GITHUB_REF_NAME}, root version ${root_version}, and Python binding version ${python_version} must match" >&2
            exit 1
          fi
          cargo metadata --locked --format-version 1 --manifest-path python/Cargo.toml > /dev/null
          uv lock --check --directory python
      - name: Verify crate package contents
        run: cargo package

  test:
    name: Rust test (${{ matrix.name }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64-linux, runner: ubuntu-26.04 }
          - { name: aarch64-linux, runner: ubuntu-26.04-arm }
          - { name: aarch64-darwin, runner: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Lavapipe runs the wgpu backend's tests without a GPU (see ci.yml).
      - if: runner.os == 'Linux'
        run: sh .github/scripts/install-lavapipe.sh
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: publish-test-${{ matrix.name }}
      - run: mbx nextest run --all-features
      - run: mbx test --doc --all-features

  python-wheels:
    name: Python wheels / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux x86_64, slug: manylinux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_28", ft_interpreter: /opt/python/cp314-cp314t/bin/python3.14t }
          - { name: manylinux aarch64, slug: manylinux-aarch64, runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28", ft_interpreter: /opt/python/cp314-cp314t/bin/python3.14t }
          # Alpine and other musl distributions cannot load manylinux wheels.
          # maturin-action's default musllinux image (rust-musl-cross) has no
          # /opt/python interpreters, so both musl builds use the pypa images.
          - { name: musllinux x86_64, slug: musllinux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, ft_interpreter: /opt/python/cp314-cp314t/bin/python3.14t, container: "quay.io/pypa/musllinux_1_2_x86_64:latest", musl: true }
          - { name: musllinux aarch64, slug: musllinux-aarch64, runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, ft_interpreter: /opt/python/cp314-cp314t/bin/python3.14t, container: "quay.io/pypa/musllinux_1_2_aarch64:latest", musl: true }
          - { name: macOS arm64, slug: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin, manylinux: "", ft_interpreter: "" }
          - { name: Windows x86_64, slug: windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc, manylinux: "", ft_interpreter: "" }
    env:
      UV_MANAGED_PYTHON: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
          working-directory: python
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          args: --release --locked --out dist
          working-directory: python
      # Lavapipe runs the wgpu tests without a GPU (see ci.yml); the
      # musllinux wheels' Alpine test container installs Alpine's own below.
      - if: runner.os == 'Linux' && !matrix.musl
        run: sh .github/scripts/install-lavapipe.sh
      # The latest-Python test runs first: "3" matches any installed 3.x, so
      # only on a runner without managed Pythons does it fetch the newest one.
      - name: Test abi3 wheel on latest Python
        if: ${{ !matrix.musl }}
        run: sh ../.github/scripts/test-wheel.sh 3 'dist/*cp311-abi3*.whl'
        working-directory: python
      - name: Test abi3 wheel on Python 3.11
        if: ${{ !matrix.musl }}
        run: sh ../.github/scripts/test-wheel.sh 3.11 'dist/*cp311-abi3*.whl'
        working-directory: python
      - name: Set up free-threaded Python for macOS and Windows
        if: "!startsWith(matrix.target, 'x86_64-unknown-linux') && !startsWith(matrix.target, 'aarch64-unknown-linux')"
        id: ft-python
        run: |
          uv python install 3.14t
          echo "python-path=$(uv python find 3.14t)" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          args: --release --locked --out dist -i "${{ matrix.ft_interpreter || steps.ft-python.outputs.python-path }}"
          working-directory: python
      - name: Test free-threaded wheel
        if: ${{ !matrix.musl }}
        run: sh ../.github/scripts/test-wheel.sh 3.14t 'dist/*cp314-cp314t*.whl'
        working-directory: python
      # musllinux wheels do not install on the glibc runner: test both in
      # Alpine, against uv's musl builds of the same interpreters. The
      # checkout is mounted read-only, so the container cannot alter the
      # wheels uploaded below; the environment lives in /venv instead.
      # scikit-learn has no musllinux wheels, so test-wheel.sh leaves it and
      # its tests out there. Alpine's lavapipe (mesa-vulkan-swrast) runs the
      # wgpu tests, as install-lavapipe.sh does on the glibc runners.
      - name: Test musllinux wheels on Alpine
        if: ${{ matrix.musl }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/io:ro" --workdir /io/python \
            --env UV_MANAGED_PYTHON --env UV_PROJECT_ENVIRONMENT=/venv --env VIRTUAL_ENV=/venv \
            --env PYTHONDONTWRITEBYTECODE=1 --env HESSBOOST_REQUIRE_WGPU=1 \
            ghcr.io/astral-sh/uv:0.12-alpine sh -euc '
              apk add --no-cache --quiet mesa-vulkan-swrast vulkan-loader
              sh ../.github/scripts/test-wheel.sh 3 "dist/*cp311-abi3*.whl"
              sh ../.github/scripts/test-wheel.sh 3.11 "dist/*cp311-abi3*.whl"
              sh ../.github/scripts/test-wheel.sh 3.14t "dist/*cp314-cp314t*.whl"
            '
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.slug }}
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  python-sdist:
    name: Python source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  verify-dists:
    name: Verify Python distributions
    needs: [python-wheels, python-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: Verify distribution set
        run: |
          shopt -s nullglob
          files=(dist/*)
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          [[ ${#wheels[@]} -eq 12 && ${#sdists[@]} -eq 1 && ${#files[@]} -eq 13 ]] || {
            echo "Expected exactly twelve wheels and one sdist; found ${#wheels[@]} wheels, ${#sdists[@]} sdists, ${#files[@]} files." >&2
            exit 1
          }
          expected=(
            'cp311-abi3-manylinux_*_x86_64'
            'cp311-abi3-manylinux_*_aarch64'
            'cp311-abi3-musllinux_1_2_x86_64'
            'cp311-abi3-musllinux_1_2_aarch64'
            'cp311-abi3-macosx_*_arm64'
            'cp311-abi3-win_amd64'
            'cp314-cp314t-manylinux_*_x86_64'
            'cp314-cp314t-manylinux_*_aarch64'
            'cp314-cp314t-musllinux_1_2_x86_64'
            'cp314-cp314t-musllinux_1_2_aarch64'
            'cp314-cp314t-macosx_*_arm64'
            'cp314-cp314t-win_amd64'
          )
          for tag in "${expected[@]}"; do
            compgen -G "dist/*${tag}*.whl" > /dev/null || { echo "Missing wheel matching ${tag}" >&2; exit 1; }
          done
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - run: uvx twine check --strict dist/*
      # auditwheel vendors libgcc_s (the unwinder of Rust's dynamically linked
      # musl cdylibs) into hessboost.libs/, which holds no Python modules. Pin
      # the musllinux top level to exactly those two entries instead of
      # W009/W010.
      - name: Check wheel contents
        run: |
          shopt -s extglob
          uvx check-wheel-contents dist/!(*musllinux*).whl
          uvx check-wheel-contents --toplevel hessboost,hessboost.libs --ignore W010 dist/*musllinux*.whl

  crates-publish:
    name: Publish crate to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, test, verify-dists]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Toolchain from mise.toml (mise-action caches the tools, see ci.yml).
      # No compiler cache: the published crate must not depend on restored
      # build outputs.
      - uses: jdx/mise-action@v4
      - name: Select crates.io authentication method
        id: auth-mode
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [[ -n "$CRATES_IO_TOKEN" ]]; then echo "method=api-token" >> "$GITHUB_OUTPUT"; else echo "method=trusted-publishing" >> "$GITHUB_OUTPUT"; fi
      - name: Authenticate with crates.io using trusted publishing
        id: auth
        if: steps.auth-mode.outputs.method == 'trusted-publishing'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate if absent
        shell: bash
        env:
          TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          TRUSTED_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -H 'User-Agent: hessboost release workflow (https://github.com/brndnmtthws/hessboost)' "https://crates.io/api/v1/crates/hessboost/${version}")"
          case "$status" in
            200) echo "hessboost ${version} is already published; skipping." ;;
            404)
              export CARGO_REGISTRY_TOKEN="${TOKEN:-$TRUSTED_TOKEN}"
              cargo publish --all-features
              ;;
            *) echo "Unexpected HTTP status ${status} from crates.io." >&2; exit 1 ;;
          esac

  pypi-publish:
    name: Publish Python package to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, test, verify-dists]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hessboost
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: true

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [crates-publish, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          discussion_category_name: General
          generate_release_notes: true
          files: dist/*
