[package]
name = "hessboost-python"
# Must equal the root crate's version: the wheel version comes from here.
version = "0.2.0"
authors = ["Brenden Matthews <brenden@brndn.io>"]
description = "Python bindings for hessboost"
edition = "2024"
license = "Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/brndnmtthws/hessboost"
rust-version = "1.93"
# What `maturin sdist` packages from this directory (build outputs such as
# `dist/`, `target/` and a `maturin develop` extension module stay out).
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/README.md",
  "/pyproject.toml",
  "/python/hessboost/**/*.py",
  "/python/hessboost/**/*.pyi",
  "/python/hessboost/py.typed",
  "/src/**/*.rs",
  "/tests/**/*.py",
]

[lib]
name = "_hessboost"
crate-type = ["cdylib"]
# An extension module has no Rust test harness; the Python tests exercise it.
test = false
doctest = false

[dependencies]
hessboost = { path = ".." }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py311"] }
# Parameter mappings deserialize into `TrainingParams` through serde;
# `float_roundtrip` as in the root crate.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# Conformal calibrators borrow their model; `self_cell` keeps the model and
# the calibrator in one object without `unsafe` here.
self_cell = "1.2"

# `device="metal"` in the macOS wheels.
[target.'cfg(target_os = "macos")'.dependencies]
hessboost = { path = "..", features = ["metal"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Array lengths, row counts and indices convert between usize/u32/i64/f64
# at the Python boundary; their ranges are bounded by the data.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# PyO3 functions return `PyResult`; per-function error sections are
# boilerplate. `needless_pass_by_value`: PyO3 extracts arguments by value.
missing_errors_doc = "allow"
needless_pass_by_value = "allow"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"

# Isolated from the root crate, like `fuzz/`.
[workspace]
