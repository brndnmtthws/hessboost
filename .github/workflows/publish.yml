name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run cargo publish with --dry-run (no upload)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Toolchain from mise.toml. No compiler cache: published artifacts must
      # not depend on restored build outputs.
      - uses: jdx/mise-action@v4
        with:
          cache: false

      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="hessboost"))')"
          echo "tag=$tag crate=$crate_version"
          if [ "$tag" != "$crate_version" ]; then
            echo "::error::Git tag v$tag does not match hessboost Cargo.toml version $crate_version"
            exit 1
          fi

      - name: cargo test
        run: cargo test --all-features

      - name: cargo publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: cargo publish --all-features --dry-run

      - name: cargo publish
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --all-features
