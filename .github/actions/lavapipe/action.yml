name: Install lavapipe
description: >-
  Install Mesa's lavapipe software Vulkan adapter on an Ubuntu runner from
  packages cached per runner image, and set HESSBOOST_REQUIRE_WGPU
  (.github/scripts/install-lavapipe.sh).
runs:
  using: composite
  steps:
    # The key names the runner image (ImageOS and ImageVersion), on which apt
    # resolves the same packages every time, and the installer's hash, so a
    # change to the packages it installs downloads a new set.
    - id: key
      shell: bash
      run: |
        installer="$(sha256sum "$GITHUB_WORKSPACE/.github/scripts/install-lavapipe.sh" | cut -c1-16)"
        echo "key=lavapipe-${ImageOS:?}-${ImageVersion:?}-$(dpkg --print-architecture)-$installer" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/lavapipe-debs
        key: ${{ steps.key.outputs.key }}
    - shell: bash
      run: sh "$GITHUB_WORKSPACE/.github/scripts/install-lavapipe.sh" "$RUNNER_TEMP/lavapipe-debs"
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/lavapipe-debs
        key: ${{ steps.key.outputs.key }}
