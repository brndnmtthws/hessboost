[package]
name = "hessboost-cuda-kernels"
version = "0.0.0"
publish = false
edition = "2024"
description = "hessboost's CUDA kernels, compiled to PTX by cuda-oxide"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
# cuda-oxide's device crate. `build.sh` builds the codegen backend from this
# same revision (cargo-oxide resolves it through Cargo.lock), so the pin here,
# `rust-toolchain.toml`'s nightly, and mise.toml's cargo-oxide move together.
cuda-device = { git = "https://github.com/NVIDIA/cuda-rust", rev = "a73ec6ef7fe2922c93f5d1e1f2e3de67c891a760" }

# cuda-oxide writes one PTX module per crate build: `build.sh` builds the
# training kernels and the prediction kernels separately, so that a
# prediction context JIT-compiles only its own two.
[features]
train = []
predict = []

# Keep this crate out of hessboost's build: it needs cuda-oxide's nightly.
[workspace]
members = ["."]

# The root crate's lint policy (`../Cargo.toml`), checked by CI with
# `cargo clippy --features train` and `--features predict` from this
# directory (a host-target check: cuda-oxide's codegen is not involved).
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# Numeric kernels convert between f32/f64/usize/u32 on purpose; value ranges
# are bounded by the data model (bins, feature ids, row counts).
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Exact comparisons are intentional: sentinels, split thresholds, test oracles.
float_cmp = "allow"
# Math code uses the conventional short names (g, h, w, x, y, lo, hi).
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Every fallible API returns HessboostError; per-function sections are boilerplate.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Hot prediction/histogram/SIMD helpers; forced inlining is measured.
inline_always = "allow"
# `#[kernel]` exports each entry with `#[no_mangle]`; cuda-oxide's codegen,
# not rustc, lowers its parameters (slices as pointer and length, structs
# by value: `lib.rs`'s ABI section), so the Rust ABI never reaches a caller.
# `extern "C"` would make rustc flag the safe kernels' `&[T]` parameters as
# not FFI-safe.
no_mangle_with_rust_abi = "allow"
