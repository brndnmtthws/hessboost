name: Publish to crates.io

on:
  push:
    tags:
      - v*

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { name: x86_64-linux, runner: ubuntu-26.04 }
          - { name: aarch64-linux, runner: ubuntu-26.04-arm }
          - { name: aarch64-darwin, runner: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          cache: false
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: publish-test
      - run: mbx nextest run --all-features
      # nextest does not run doctests.
      - run: mbx test --doc --all-features

  publish:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
      discussions: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Toolchain from mise.toml. No compiler cache: the published crate must
      # not depend on restored build outputs.
      - uses: jdx/mise-action@v4
        with:
          cache: false

      - name: Verify tag matches crate version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "hessboost") | .version')"
          echo "tag=$tag crate=$crate_version"
          if [ "$tag" != "$crate_version" ]; then
            echo "::error::Git tag v$tag does not match hessboost Cargo.toml version $crate_version"
            exit 1
          fi

      # The release body is this version's CHANGELOG.md section (without its
      # heading); GitHub's generated pull-request list follows it. Checked
      # before publishing, so a missing or undated section stops the release.
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$version] - " '
            index($0, heading) == 1 { found = 1; date = substr($0, length(heading) + 1); next }
            found && /^## \[/ { exit }
            found { print }
            END {
              if (!found) { print "no \"" heading "YYYY-MM-DD\" section" > "/dev/stderr"; exit 1 }
              if (date !~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) {
                print "section date is \"" date "\", not YYYY-MM-DD" > "/dev/stderr"; exit 1
              }
            }
          ' CHANGELOG.md > "$notes" || {
            echo "::error::CHANGELOG.md needs a dated '## [$version] - YYYY-MM-DD' section"
            exit 1
          }
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md section for $version is empty"
            exit 1
          fi

      - name: Select crates.io authentication method
        id: auth-mode
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [[ -n "$CRATES_IO_TOKEN" ]]; then
            echo "method=api-token" >> "$GITHUB_OUTPUT"
          else
            echo "method=trusted-publishing" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io using trusted publishing
        id: auth
        if: steps.auth-mode.outputs.method == 'trusted-publishing'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish using API token
        if: steps.auth-mode.outputs.method == 'api-token'
        run: cargo publish --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish using trusted publishing
        if: steps.auth-mode.outputs.method == 'trusted-publishing'
        run: cargo publish --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          discussion_category_name: General
          # The body (the CHANGELOG section) is prepended to the generated notes.
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
